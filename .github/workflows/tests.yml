name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  desktop:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install native Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install '.[desktop]'
      - name: Check native Qt imports
        run: python -c "from PySide6 import QtGui, QtWidgets, QtQuick, QtSvg, QtDBus"
      - run: python -m unittest discover -s tests -v

  arch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - name: Install documented Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git python python-pip binutils zlib glib2 krb5 fontconfig libglvnd \
            libxkbcommon libxkbcommon-x11 libxcb xcb-util-cursor wayland dbus
      - uses: actions/checkout@v7
      - name: Build using the end-user instructions
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/python -m pip install --no-cache-dir -r packaging/requirements-build.txt
          .venv-build/bin/python -m pip install --no-deps --no-build-isolation .
          .venv-build/bin/python -m pip check
          .venv-build/bin/python tools/build_binary.py
      - name: Check standalone executable without the build environment
        run: |
          runtime_dir=$(mktemp -d)
          cp dist/fx240-lcd-studio "$runtime_dir/"
          mv .venv-build "$runtime_dir/build-environment"
          cd "$runtime_dir"
          env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV \
            PYTHONNOUSERSITE=1 ./fx240-lcd-studio self-test
          ./fx240-lcd-studio --help

  arch-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - name: Install package build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git python python-pip desktop-file-utils hicolor-icon-theme \
            zlib glib2 krb5 fontconfig libglvnd libxkbcommon libxkbcommon-x11 \
            libxcb xcb-util-cursor wayland dbus
      - uses: actions/checkout@v7
      - name: Build the package as an unprivileged user
        run: |
          useradd --create-home packager
          install -d -o packager -g packager /tmp/fx240-package
          install -m644 packaging/arch/PKGBUILD /tmp/fx240-package/PKGBUILD
          runuser -u packager -- sh -c 'cd /tmp/fx240-package && makepkg --noconfirm --cleanbuild'
      - name: Install and check the package
        run: |
          pacman -U --noconfirm /tmp/fx240-package/*.pkg.tar.zst
          desktop-file-validate /usr/share/applications/org.fx240lcdstudio.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/org.fx240lcdstudio.svg
          test -f /usr/share/licenses/fx240-lcd-studio-git/NOTICE.md
          runuser -u packager -- /usr/bin/fx240-lcd-studio self-test
          runuser -u packager -- /usr/bin/fx240 --help
      - name: Check package removal
        run: |
          pacman -R --noconfirm fx240-lcd-studio-git
          test ! -e /usr/bin/fx240-lcd-studio
          test ! -e /usr/bin/fx240
          test ! -e /usr/share/applications/org.fx240lcdstudio.desktop
          test ! -e /usr/share/icons/hicolor/scalable/apps/org.fx240lcdstudio.svg
