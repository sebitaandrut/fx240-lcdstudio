name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install '.[desktop]'
      - name: Check native Qt imports
        run: python -c "from PySide6 import QtGui, QtWidgets, QtQuick, QtSvg, QtDBus"
      - run: python -m unittest discover -s tests -v
