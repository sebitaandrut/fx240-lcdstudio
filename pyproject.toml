[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fx240-linux"
version = "0.2.0"
description = "FX240 LCD STUDIO: experimental native Linux display client for ID-COOLING FX240"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["Pillow>=13.0.0"]

[project.scripts]
fx240 = "fx240.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.11.3,!=6.12.0"]
build = ["PyInstaller>=6.22.3,<7"]
analysis = ["numpy>=1.26", "opencv-python-headless>=4.8"]

[tool.setuptools.package-data]
fx240 = ["qml/*.qml", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md", "assets/icons/*.svg", "assets/icons/*.txt", "assets/icons/*.json", "assets/icons/*.md", "assets/icons/dark/*.svg", "assets/icons/light/*.svg", "assets/branding/*.svg", "assets/branding/*.md"]
